name: Aceitação (preview)

# RD-78 (CEO 25/09): toda PR roda a sua jornada de aceitação contra o PREVIEW da Vercel antes do merge.
# Dispara quando a Vercel marca o deployment de preview como success (deployment_status); roda no commit
# do deployment (github.sha = commit da PR), na Demonstração Revenda (is_demo). Nunca toca empresa real.
# Contexto: erp_contexto_projeto 56bd2058 (regra, diagnóstico, 4 encaixes). Piloto: PR #1806.
on:
  deployment_status:

jobs:
  # Triagem barata (sem fila, ~10 s): decide se a aceitação pesada precisa rodar e limpa a fila (RD-42, minutos do Actions).
  #  (1) libera a vaga única (passo "Liberar vaga"): cancela runs de aceitação de PR mergeada/fechada ou SHA superado/órfão;
  #  (2) pula a aceitação quando o diff da PR (contra a main) só tem .md / workflow / AGENTS.md e nenhum spec em
  #      e2e/jornadas/aceitacao — nada a testar, custo zero. Qualquer outro arquivo → roda normalmente.
  #  (3) ESTEIRA EM 2 VELOCIDADES (CEO 07/10): a suíte pesada só roda na VIA REVISADA (PR com a etiqueta
  #      revisao-eng-chefe). PR sem a etiqueta (via rápida) e commit sem PR aberta: aceitação DISPENSADA (o job
  #      aceitacao fica skipped e NÃO entra na fila aceitacao-testes) — a via rápida é julgada na aceitação da main.
  #      Etiqueta posta depois → aceitacao-etiqueta.yml re-roda este run e a triagem lê a etiqueta de novo.
  triagem:
    if: >-
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment.environment, 'Production') &&
      !contains(github.event.deployment.environment, 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      rodar: ${{ steps.decide.outputs.rodar }}
      vaga: ${{ steps.decide.outputs.vaga }}
    steps:
      # Código confiável da main (só para rodar o prune; a PR nunca é executada aqui).
      - uses: actions/checkout@v4
        with:
          ref: main
      # (CEO 10/10) Libera a vaga ÚNICA: cancela na hora os runs de aceitação que a ocupam à toa (PR mergeada/fechada ou
      # SHA superado/órfão). Não mexe no SHA desta rodada (SELF_SHA), na versão viva de PR aberta, nem na serialização.
      - name: Liberar vaga (cancela aceitação de PR morta / SHA superado)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          SELF_SHA: ${{ github.event.deployment.sha }}
        run: scripts/merge/aceitacao-prune.sh || true
      - name: Decide e limpa a fila
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # Pool de bancos de teste (CEO 10/10): nº de vagas = nº de bancos provisionados (var ACEITACAO_VAGAS, padrão 1 =
          # serial, como hoje). URL1/URL2 só servem para CONFIRMAR que a vaga tem banco antes de sharding nela.
          VAGAS: ${{ vars.ACEITACAO_VAGAS || '1' }}
          URL1: ${{ secrets.TEST_SUPABASE_URL_1 }}
          URL2: ${{ secrets.TEST_SUPABASE_URL_2 }}
        run: |
          rodar=true
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty' 2>/dev/null || true)
          if [ -z "$pr" ]; then
            rodar=false
            echo "::notice::commit sem PR aberta: aceitação dispensada (julgada na aceitação da main)"
          else
            echo "PR aberta: #$pr"
            # (3) via rápida (sem revisao-eng-chefe): aceitação dispensada; etiqueta lida AGORA (re-run após etiquetar)
            revisada=$(gh api "repos/$REPO/pulls/$pr" --jq '[.labels[].name] | index("revisao-eng-chefe") != null' 2>/dev/null || echo true)
            if [ "$revisada" != true ]; then
              rodar=false
              echo "::notice::via rápida: julgada na aceitação da main (PR #$pr sem a etiqueta revisao-eng-chefe)"
            fi
            # (2) só doc/workflow sem spec?
            files=$(gh api "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename' 2>/dev/null || true)
            if [ -n "$files" ]; then
              outros=$(echo "$files" | grep -vE '(\.md$|^\.github/workflows/|^AGENTS\.md$|^CLAUDE\.md$)' || true)
              spec=$(echo "$files" | grep -E '^e2e/jornadas/aceitacao/' || true)
              if [ -z "$outros" ] && [ -z "$spec" ]; then
                rodar=false
                echo "::notice::Diff só com .md/workflow e sem spec de aceitação: aceitação pulada (custo zero)."
              fi
            fi
            # (1) a limpeza da fila (runs de PR morta / SHA superado) é feita pelo passo "Liberar vaga" acima
            #     (scripts/merge/aceitacao-prune.sh), que cobre a mesma PR superada E as PRs mergeadas/fechadas/órfãs.
            :
          fi
          echo "rodar=$rodar" >> "$GITHUB_OUTPUT"
          # VAGA = banco do pool desta rodada (o operador % não existe nas expressões do Actions, por isso aqui no bash).
          # Com ACEITACAO_VAGAS=1 (padrão) a vaga é sempre 0 → um grupo de concorrência só → serial, como hoje.
          vagas="$VAGAS"; case "$vagas" in ''|*[!0-9]*) vagas=1;; esac; [ "$vagas" -ge 1 ] || vagas=1
          v=$(( ${{ github.run_number }} % vagas ))
          # Segurança: só faz sharding numa vaga > 0 se o banco dela estiver provisionado (segredo presente). Senão cai
          # para 0 — nunca deixa dois grupos (vagas) baterem no MESMO banco (a colisão de seed/reset que queremos evitar).
          case "$v" in 1) [ -n "$URL1" ] || v=0;; 2) [ -n "$URL2" ] || v=0;; esac
          echo "vaga de aceitação: $v (de $vagas)"
          echo "vaga=$v" >> "$GITHUB_OUTPUT"

  aceitacao:
    needs: triagem
    # só preview com sucesso (ignora Production e estados pending/failure); triagem pode dispensar (diff só .md/workflow)
    if: >-
      needs.triagem.outputs.rodar == 'true' &&
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment.environment, 'Production') &&
      !contains(github.event.deployment.environment, 'production')
    runs-on: ubuntu-latest
    # Fila única da demo (CEO 30/09): todo workflow que roda Playwright na demonstração entra no MESMO grupo e espera
    # a vez em FIFO (queue: max, até 100), sem ocupar runner e sem estourar tempo. Antes, cada run pegava um runner e
    # disputava a trava no banco — com 3+ PRs, a espera passava de 30 min e a aceitação ficava vermelha sem rodar teste.
    # Chave do banco de testes (CEO 06/10): com a variável de repositório ACEITACAO_BANCO=testes a aceitação roda
    # contra o banco de TESTES (segredos TEST_*), timeout 40 min. Sem a variável, tudo como antes (produção, fila
    # única demo-e2e). O CEO só liga depois de trocar o ambiente Preview da Vercel.
    # CEO 07/10: UMA fila (FIFO, fora do runner) também no banco de testes. Com 3 grupos (vagas) e 1 trava no banco,
    # 3 jobs rodavam e 2 esperavam a trava dentro do runner, gastando os 40 min / estourando os 15 min de espera
    # ('[trava-demo] demo ocupada há mais de 15 min'). Os specs usam demos 001..005 fixas e fn_demo_reset é por demo:
    # paralelismo real só com um banco de testes por vaga (decisão do CEO); até lá a vez é esperada na fila.
    concurrency:
      # Pool de bancos (CEO 10/10): no banco de testes, UM grupo POR VAGA (aceitacao-testes-<vaga>) → vagas diferentes
      # rodam EM PARALELO (um banco cada), e dentro de uma vaga segue serial (sem colisão de seed). Com ACEITACAO_VAGAS=1
      # a vaga é sempre 0 → um grupo só → serial, idêntico a antes. Em produção, o grupo único demo-e2e é preservado.
      group: ${{ vars.ACEITACAO_BANCO == 'testes' && format('aceitacao-testes-{0}', needs.triagem.outputs.vaga) || 'demo-e2e' }}
      cancel-in-progress: false
      queue: max
    # 40 min (CEO 06/10, regra e): a espera na fila demo-e2e é FORA do runner e não conta; preso além disso o
    # vigia-runs.yml cancela aos 45. A trava no banco (segunda guarda) espera no máximo 15 min.
    timeout-minutes: 40
    # actions: write → o run pode cancelar a si mesmo quando a versão é antiga (passo "Versão antiga?")
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Versão antiga do mesmo ramo (CEO 01/10): ao chegar a vez na fila, se este commit já não é o último da PR, o run
      # se cancela em segundos e libera a fila para o próximo (antes testava ~25 min uma versão que não vai ser mergeada).
      # Não dá para usar concurrency por ramo: no deployment_status da Vercel o ref é o SHA e não vem o nome do ramo.
      # Fila única entre ramos diferentes continua (grupo demo-e2e acima). Commit fora de PR aberta → testa normalmente.
      - name: Versão antiga? (descarta e libera a fila)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          heads=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open") | .head.sha] | join(" ")' 2>/dev/null || true)
          main_head=$(gh api "repos/$REPO/commits/main" --jq '.sha' 2>/dev/null || true)
          echo "commit testado: $SHA"
          echo "último commit das PRs abertas que contêm este commit: ${heads:-<nenhuma PR aberta>}"
          if [ -n "$heads" ] && ! echo " $heads " | grep -q " $SHA "; then
            echo "::notice::Versão antiga ($SHA): a PR já está em $heads. Teste descartado para liberar a fila."
            gh run cancel "$RUN_ID" -R "$REPO"
            sleep 120
            exit 1
          elif [ -z "$heads" ] && [ -n "$main_head" ] && [ "$SHA" != "$main_head" ]; then
            # (CEO 10/10) sem PR aberta para este SHA e não é a cabeça da main → PR mergeada/fechada ou SHA órfão:
            # versão morta. Não ocupa 40 min da vaga única — descarta ao pegar o runner.
            echo "::notice::Versão morta ($SHA): sem PR aberta e fora da main. Teste descartado para liberar a fila."
            gh run cancel "$RUN_ID" -R "$REPO"
            sleep 120
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      # PARTE A (CEO 10/10, sessão interativa): encurta o run rodando só as jornadas da ÁREA tocada pela PR. Fallback
      # OBRIGATÓRIO à suíte COMPLETA quando a PR toca núcleo/compartilhado (migration, .sql/RLS/policy/grant/view/
      # SECURITY DEFINER/guarda, fiscal, componentes/libs compartilhados, .github/**) ou quando não dá para mapear a
      # área com segurança. NUNCA pula. A serialização entre PRs (grupo demo-e2e/aceitacao-testes) NÃO muda.
      - name: Escopo da aceitação (área da PR; fallback = tudo)
        id: escopo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          d=$(npx tsx scripts/merge/escopo-aceitacao.ts || echo '{"full":true,"specs":[],"motivo":"erro no escopo — roda tudo"}')
          echo "escopo (json): $d"
          full=$(printf '%s' "$d" | jq -r '.full')
          motivo=$(printf '%s' "$d" | jq -r '.motivo')
          if [ "$full" = "false" ]; then
            alvo=$(printf '%s' "$d" | jq -r '.specs | join(" ")')
            n=$(printf '%s' "$d" | jq -r '.specs | length')
            echo "::notice title=Aceitação escopada::$n jornada(s) — $motivo"
            echo "### Aceitação escopada: $n jornada(s) — $motivo" >> "$GITHUB_STEP_SUMMARY"
          else
            alvo="e2e/jornadas/aceitacao"
            echo "::notice title=Aceitação completa (fallback)::$motivo"
            echo "### Aceitação completa (fallback) — $motivo" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ACEITACAO_ALVO=$alvo" >> "$GITHUB_ENV"
      # Prova no log (RD-38): de onde veio a URL que o robô abre. environment_url = URL do deployment
      # (*.vercel.app); target_url = página de inspeção na vercel.com (não serve como base do app).
      - name: URL do preview (diagnóstico)
        env:
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          PROD_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          echo "environment_url = ${ENVIRONMENT_URL:-<vazio>}"
          echo "target_url      = ${TARGET_URL:-<vazio>}"
          echo "PROD_BASE_URL   = ${PROD_BASE_URL:-<vazio>}"
      # Pool de bancos (CEO 10/10): escolhe o banco da VAGA (0/1/2) e exporta SUPABASE_URL/ANON/SERVICE para os passos de
      # teste abaixo. Em produção (ACEITACAO_BANCO != testes), usa os segredos de produção. A triagem já garante que a
      # vaga > 0 só vem com o banco provisionado — aqui o mapeamento é direto, sem colisão de dados entre vagas.
      - name: Selecionar o banco da vaga (pool de aceitação)
        env:
          VAGA: ${{ needs.triagem.outputs.vaga }}
          MODO_TESTES: ${{ vars.ACEITACAO_BANCO == 'testes' }}
          URL0: ${{ secrets.TEST_SUPABASE_URL }}
          ANON0: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SRK0: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          URL1: ${{ secrets.TEST_SUPABASE_URL_1 }}
          ANON1: ${{ secrets.TEST_SUPABASE_ANON_KEY_1 }}
          SRK1: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY_1 }}
          URL2: ${{ secrets.TEST_SUPABASE_URL_2 }}
          ANON2: ${{ secrets.TEST_SUPABASE_ANON_KEY_2 }}
          SRK2: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY_2 }}
          PURL: ${{ secrets.SUPABASE_URL }}
          PANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PSRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -u
          if [ "$MODO_TESTES" = "true" ]; then
            case "${VAGA:-0}" in
              1) URL="$URL1"; ANON="$ANON1"; SRK="$SRK1";;
              2) URL="$URL2"; ANON="$ANON2"; SRK="$SRK2";;
              *) URL="$URL0"; ANON="$ANON0"; SRK="$SRK0";;
            esac
            echo "banco da aceitação: vaga ${VAGA:-0} (banco de testes)"
          else
            URL="$PURL"; ANON="$PANON"; SRK="$PSRK"
            echo "banco da aceitação: produção"
          fi
          [ -n "$URL" ] && [ -n "$SRK" ] || { echo "::error::banco da vaga ${VAGA:-0} sem segredo — abortado"; exit 1; }
          echo "::add-mask::$SRK"
          { echo "SUPABASE_URL=$URL"; echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"; echo "SUPABASE_SERVICE_ROLE_KEY=$SRK"; } >> "$GITHUB_ENV"
      # @pos-migration (CEO 26/09): teste que depende de migration só é verdade DEPOIS do merge (o deploy-migrations
      # aplica no push da main; o preview roda o código novo contra o banco ATUAL). Aqui ele fica FORA do passo que
      # bloqueia e roda no passo informativo abaixo; o veredito é o aceitacao-pos-migration.yml, em produção.
      - name: Jornadas de aceitação contra o preview
        timeout-minutes: 30
        env:
          PROD_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # SUPABASE_URL/ANON/SERVICE vêm do passo "Selecionar o banco da vaga" (GITHUB_ENV).
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
          TRAVA_DEMO_ESPERA_MIN: '15'
          # Só necessário se o preview tiver Deployment Protection (401 da Vercel): Settings › Deployment
          # Protection › "Protection Bypass for Automation" gera o segredo; o CEO cadastra no GitHub.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        # --pass-with-no-tests: PR sem .spec.ts em aceitacao/ (hotfix, infra, docs) passa; PR com spec e julgada pelo spec.
        # A obrigacao de trazer o spec e do processo (RD-78), nao de um check que quebra por ausencia. Sem isto, a propria PR-I
        # (que nao traz spec) ficaria vermelha para sempre e o check nunca poderia ser obrigatorio.
        run: npx playwright test ${ACEITACAO_ALVO:-e2e/jornadas/aceitacao} --project=celular --pass-with-no-tests --grep-invert @pos-migration
      # Informativo: roda os @pos-migration no preview e NÃO bloqueia (continue-on-error). Vermelho aqui é esperado
      # enquanto a migration não entrou; o aviso sai na aba de resumo. Quem decide é o job pós-merge em produção.
      - name: Aceitação @pos-migration (informativo — não bloqueia)
        timeout-minutes: 15
        if: success() || failure()
        continue-on-error: true
        env:
          PROD_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # SUPABASE_URL/ANON/SERVICE vêm do passo "Selecionar o banco da vaga" (GITHUB_ENV).
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
          TRAVA_DEMO_ESPERA_MIN: '15'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if npx playwright test ${ACEITACAO_ALVO:-e2e/jornadas/aceitacao} --project=celular --pass-with-no-tests --grep @pos-migration --output=test-results/pos-migration; then
            echo "### @pos-migration no preview: verde" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=@pos-migration (informativo)::vermelho no preview — esperado se a migration da PR ainda não entrou. Veredito: aceitacao-pos-migration em produção, logo após o merge."
            echo "### @pos-migration no preview: vermelho (informativo, não bloqueia) — veredito em produção após o merge" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # CEO 07/10: libera a trava da demo SEMPRE (cancelamento/timeout não rodam o global-teardown; a lease ficava até
      # 25 min e a aceitação seguinte esperava sem rodar teste).
      - name: Soltar a trava da demo (sempre)
        if: always()
        continue-on-error: true
        env:
          # SUPABASE_URL/SERVICE vêm do passo "Selecionar o banco da vaga" (GITHUB_ENV) — solta a trava no MESMO banco.
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/e2e-trava-soltar.ts
      # Sempre sobe o diagnóstico do global-setup (screenshots com/sem ps_allow_preview); relatório completo só na falha.
      - name: Upload diagnóstico do host (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aceitacao-diagnostico-host
          path: e2e/diagnostico-host/
          if-no-files-found: ignore
      - name: Upload relatório (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aceitacao-preview-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
