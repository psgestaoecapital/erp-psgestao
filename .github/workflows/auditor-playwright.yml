name: Auditor Camada 1 Playwright DOM

on:
  schedule:
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:

jobs:
  enumerar_dom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # O auditor importa o pacote `playwright` (1.60) — o `npx playwright` resolve o CLI do @playwright/test (1.59),
        # que baixa outro build do Chromium (1217 vs 1223) e o launch falha antes de auditar qualquer rota
        # (vermelho em todo agendamento desde 26/09). Instala com o CLI do MESMO pacote que o script usa.
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Executar auditor DOM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROD_BASE_URL: https://erp-psgestao.vercel.app
        run: npm run auditor:run

      - name: Upload artifacts (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auditor-logs
          path: scripts/auditor-output/
          if-no-files-found: ignore
