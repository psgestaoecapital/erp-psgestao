name: Build Agente ATAK (.exe)

# Builda o coletor ATAK como .exe de 2 cliques sem precisar de maquina Windows.
# Roda no runner windows-latest do GitHub Actions. O artefato fica disponivel
# pra download por 30 dias (aba Actions -> run -> Artifacts).
on:
  workflow_dispatch: {}          # botao "Run workflow" na aba Actions
  push:
    tags:
      - 'agente-v*'              # ex.: git tag agente-v2.0.0 && git push --tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collectors/atak-agente
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Sem package-lock.json no repo -> npm install (npm ci exigiria lockfile).
      - name: Instalar dependencias
        run: npm install

      # pkg nao esta nas dependencias (so o bloco de config "pkg") -> instala global.
      - name: Instalar pkg
        run: npm i -g pkg

      - name: Buildar .exe
        run: npm run build

      # Gera o versao.json COM o sha256 calculado (zero erro de sha manual · auto-update).
      # A versao vem da tag agente-vX.Y.Z (ou do package.json no dispatch manual).
      - name: Gerar versao.json (sha256 + url do Storage)
        shell: pwsh
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 dist/agente-atak.exe).Hash.ToLower()
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^agente-v(.+)$') { $versao = $Matches[1] } else { $versao = (Get-Content package.json | ConvertFrom-Json).version }
          $base = if ($env:SB_URL) { $env:SB_URL.TrimEnd('/') } else { '' }
          $manifesto = [ordered]@{
            versao = $versao
            url = "$base/storage/v1/object/public/agente/agente-atak.exe"   # URL absoluto do Storage
            sha256 = $sha
            obrigatorio = $false
            notas = "Build $ref"
          }
          $manifesto | ConvertTo-Json | Set-Content -Encoding utf8 dist/versao.json
          Write-Host "versao.json -> versao=$versao sha256=$sha url=$($manifesto.url)"
          Get-Content dist/versao.json

      # Publica no Supabase Storage (bucket público 'agente') — sem passo manual de git.
      # Requer os secrets SUPABASE_URL e SUPABASE_STORAGE_KEY (o CEO cadastra · Pilar 2).
      - name: Publicar no Supabase Storage
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SB_URL:-}" ] || [ -z "${SB_KEY:-}" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_STORAGE_KEY no repo — cadastre para publicar."
            exit 1
          fi
          curl -fsS -X POST "$SB_URL/storage/v1/object/agente/agente-atak.exe?upsert=true" \
            -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/octet-stream" \
            --data-binary @dist/agente-atak.exe
          curl -fsS -X POST "$SB_URL/storage/v1/object/agente/versao.json?upsert=true" \
            -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" \
            --data-binary @dist/versao.json
          echo "Publicado no Storage: agente-atak.exe + versao.json (bucket agente)"

      # Backup: tambem sobe como artefato (download 30 dias) — util para conferencia/rollback.
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: agente-atak-exe
          path: |
            collectors/atak-agente/dist/agente-atak.exe
            collectors/atak-agente/dist/versao.json
          retention-days: 30
          if-no-files-found: error
