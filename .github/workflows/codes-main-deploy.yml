name: Codes · estado da main e do deploy

# Painel de desempenho da aba Codes (CEO 09/10): a cada 15 min (5 min depois do snapshot do pg_cron) grava o estado
# verde/vermelho da main (gates) e do deploy-migrations no retrato mais recente. Só leitura do GitHub; checkout só da main.
on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preenche main_estado/deploy_estado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/dev/codes-main-deploy.mjs
