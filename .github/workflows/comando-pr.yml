name: Comando na PR

# Eng. Chefe 07/10: comentário EXATAMENTE "/re-rodar" numa PR, de quem tem permissão write/maintain/admin, re-roda a
# última aceitação (aceitacao-pr) do head SHA da PR com FILA_MERGE_TOKEN e responde na PR com o link do run.
# Existe porque a rede das sessões do Code troca o token pelo da integração (POST /rerun dá 403): quem re-roda é o GitHub.
# Roda o código da main (issue_comment); nunca faz checkout nem executa código da PR; o texto do comentário nunca é
# interpolado no shell (só via env).
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  re-rodar:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/re-rodar'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      AUTOR: ${{ github.event.comment.user.login }}
      GH_TOKEN: ${{ secrets.FILA_MERGE_TOKEN || github.token }}
    steps:
      - name: Re-rodar a última aceitação do head da PR
        run: |
          set -uo pipefail
          responder() { gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$1

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" > /dev/null || true; }
          perm=$(gh api "repos/$REPO/collaborators/$AUTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) ;; *) echo "autor $AUTOR sem permissão write ($perm): ignorado"; exit 0 ;; esac
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          run=$(gh api "repos/$REPO/actions/workflows/aceitacao-pr.yml/runs?head_sha=$sha&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.status) \(.html_url)"' 2>/dev/null || true)
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            responder "/re-rodar: não há run de aceitação para o commit \`${sha:0:7}\` (a aceitação nasce quando o preview da Vercel fica pronto)."; exit 0
          fi
          read -r id st url <<< "$run"
          if [ "$st" != "completed" ]; then
            responder "/re-rodar: a aceitação do commit \`${sha:0:7}\` ainda está \`$st\` — [run $id]($url). Espere terminar."; exit 0
          fi
          if gh api -X POST "repos/$REPO/actions/runs/$id/rerun" > /dev/null 2>&1; then
            responder "/re-rodar por @$AUTOR: aceitação do commit \`${sha:0:7}\` re-disparada — [run $id]($url)."
          else
            responder "/re-rodar: falha ao re-disparar o [run $id]($url) (FILA_MERGE_TOKEN ausente ou sem permissão de Actions)."
            exit 1
          fi
