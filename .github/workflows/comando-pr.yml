name: Comando na PR

# Eng. Chefe 07/10: comentário que COMEÇA com "/re-rodar" (o rodapé de atribuição das sessões do Code não pode impedir) numa PR, de quem tem permissão write/maintain/admin, re-roda a
# última aceitação (aceitacao-pr) do head SHA da PR com FILA_MERGE_TOKEN e responde na PR com o link do run.
# Existe porque a rede das sessões do Code troca o token pelo da integração (POST /rerun dá 403): quem re-roda é o GitHub.
# As respostas do workflow NÃO começam com "/re-rodar" (senão disparavam o próprio comando em laço, 13/10).
# "/re-rodar-pos" (esteira 17/10): dispara o @pos-migration na ponta da main (workflow_dispatch) com FILA_MERGE_TOKEN, para
# reavaliar um @pos vermelho por falha de ambiente sem esperar o próximo merge (a integração da sessão leva 403 no dispatch).
# Roda o código da main (issue_comment); nunca faz checkout nem executa código da PR; o texto do comentário nunca é
# interpolado no shell (só via env).
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  re-rodar:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/re-rodar') &&
      !startsWith(github.event.comment.body, '/re-rodar-pos')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      AUTOR: ${{ github.event.comment.user.login }}
      GH_TOKEN: ${{ secrets.FILA_MERGE_TOKEN || github.token }}
    steps:
      - name: Re-rodar a última aceitação do head da PR
        run: |
          set -uo pipefail
          responder() { gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$1

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" > /dev/null || true; }
          perm=$(gh api "repos/$REPO/collaborators/$AUTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) ;; *) echo "autor $AUTOR sem permissão write ($perm): ignorado"; exit 0 ;; esac
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          run=$(gh api "repos/$REPO/actions/workflows/aceitacao-pr.yml/runs?head_sha=$sha&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.status) \(.html_url)"' 2>/dev/null || true)
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            responder "Re-rodar: não há run de aceitação para o commit \`${sha:0:7}\` (a aceitação nasce quando o preview da Vercel fica pronto)."; exit 0
          fi
          read -r id st url <<< "$run"
          if [ "$st" != "completed" ]; then
            responder "Re-rodar: a aceitação do commit \`${sha:0:7}\` ainda está \`$st\` — [run $id]($url). Espere terminar."; exit 0
          fi
          if gh api -X POST "repos/$REPO/actions/runs/$id/rerun" > /dev/null 2>&1; then
            responder "Re-rodar por @$AUTOR: aceitação do commit \`${sha:0:7}\` re-disparada — [run $id]($url)."
          else
            responder "Re-rodar: falha ao re-disparar o [run $id]($url) (FILA_MERGE_TOKEN ausente ou sem permissão de Actions)."
            exit 1
          fi

  re-rodar-pos:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/re-rodar-pos')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      AUTOR: ${{ github.event.comment.user.login }}
      GH_TOKEN: ${{ secrets.FILA_MERGE_TOKEN || github.token }}
    steps:
      - name: Disparar o @pos-migration na ponta da main
        run: |
          set -uo pipefail
          responder() { gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$1

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" > /dev/null || true; }
          perm=$(gh api "repos/$REPO/collaborators/$AUTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) ;; *) echo "autor $AUTOR sem permissão write ($perm): ignorado"; exit 0 ;; esac
          andamento=$(gh api "repos/$REPO/actions/workflows/aceitacao-pos-migration.yml/runs?branch=main&per_page=5" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "${andamento:-0}" -gt 0 ]; then
            responder "Re-rodar @pos: já há $andamento run(s) do @pos-migration em andamento na main — espere terminar."; exit 0
          fi
          if gh api -X POST "repos/$REPO/actions/workflows/aceitacao-pos-migration.yml/dispatches" -f ref=main > /dev/null 2>&1; then
            responder "Re-rodar @pos por @$AUTOR: @pos-migration disparado na ponta da main — acompanhe em https://github.com/$REPO/actions/workflows/aceitacao-pos-migration.yml"
          else
            responder "Re-rodar @pos: falha ao disparar (FILA_MERGE_TOKEN ausente ou sem permissão de Actions)."
            exit 1
          fi
