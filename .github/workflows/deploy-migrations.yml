name: Deploy Migrations (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: horsymhsinqcimflrtjo
    steps:
      - uses: actions/checkout@v4

      # Última linha de defesa (RD-52): antes do push, falha se alguma migration do repo tiver versão já aplicada
      # no ledger com OUTRO nome (o db push a pularia em silêncio — colisão 20260926140000 de 26/09) ou se duas
      # migrations compartilharem versão. O gate de PR (check-migrations.yml) pega antes do merge; este pega o
      # que passou. Se a RPC fn_migrations_ledger ainda não existir (1º deploy após 20260926160000) o script só avisa.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Régua de migrations (versão única + ledger)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:migrations

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # `supabase link` falhou de forma transitória em 14/10 ("Failed to get API keys") e a #2592 foi ao ar sem a
      # migration. Tenta 3x; se esgotar, o job fica VERMELHO (e o passo final avisa) — nunca em silêncio.
      - name: supabase link (3 tentativas)
        run: |
          for i in 1 2 3; do
            supabase link --project-ref $SUPABASE_PROJECT_ID && exit 0
            echo "link falhou (tentativa $i)"; sleep $((i*10))
          done
          exit 1
      # --include-all: aplica migrations pendentes mesmo quando uma nova entra com timestamp
      # ANTERIOR à última já aplicada (ex.: PRs mergeados fora da ordem do nome do arquivo).
      # Só aplica versões NÃO rastreadas; nunca re-roda migrations já no schema_migrations.
      # Auditado em 2026-08-14: histórico consistente (0 órfãs), então o efeito é aplicar apenas
      # as pendentes reais, sem risco de re-executar migrations antigas não-idempotentes.
      - run: supabase db push --include-all

      # Falha em qualquer passo acima = migration publicada que NÃO entrou na produção (a tela pode estar no ar
      # chamando função inexistente). Abre/atualiza UMA issue `deploy-migrations-vermelho` para o Eng. Chefe.
      - name: Avisar falha (issue deploy-migrations-vermelho)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          corpo="deploy-migrations FALHOU no commit ${GITHUB_SHA}. Migrations desse merge podem não estar na produção. Run: ${RUN_URL}"
          n=$(gh api "repos/$REPO/issues?state=open&labels=deploy-migrations-vermelho&per_page=1" --jq '.[0].number // empty' || true)
          if [ -n "$n" ]; then
            gh api "repos/$REPO/issues/$n/comments" -f body="$corpo" >/dev/null
          else
            gh api "repos/$REPO/issues" -f title="deploy-migrations vermelho: migration não aplicada" -f body="$corpo" -f 'labels[]=deploy-migrations-vermelho' >/dev/null
          fi
