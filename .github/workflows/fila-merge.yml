name: Fila de merge

# CEO 06/10 (regras de merge a–d, proposta do Rodrigo · erp_contexto_projeto 5c30d735). O merge queue do GitHub exige
# plano pago de organização (RD-42); no lugar, esta fila própria: TODA PR Ready (não-draft) na main, verde (e, se for
# revisao-eng-chefe, autorizada pelo patch-id) é atualizada com a main e mergeada EM ORDEM, uma por vez. A label
# `fila-merge` é OPCIONAL (CEO 08/10 08:15); a label `nao-publicar` tira a PR da fila. Regras em scripts/merge/fila-merge.sh.
# Sem polling: acorda por evento (label, push na PR, comentário de autorização, fim de CI/aceitação/deploy, Vercel,
# push na main). Cada rodada reavalia a fila do zero (idempotente); a concorrência deixa no máximo 1 rodada pendente.
#
# FILA_MERGE_TOKEN (segredo, PAT fine-grained só deste repo: Contents, Pull requests, Issues e Actions = read/write) é
# OBRIGATÓRIO: merge e update-branch feitos com o GITHUB_TOKEN não disparam os workflows da main (deploy-migrations!).
on:
  pull_request_target:
    types: [opened, reopened, labeled, unlabeled, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      - 'Aceitação (preview)'
      - 'Aceitação @pos-migration (produção)'
      - 'Deploy Migrations (Production)'
      - 'Guarda de funções do banco (REVOKE anon + autoria auth.uid)'
      - 'Régua de menu (rota × página)'
      - 'Régua de migrations (versão única · sem colisão com o ledger)'
    types: [completed]
  status:
  push:
    branches: [main]
  workflow_dispatch:
  # Rede de segurança (CEO 10/10): a fila é event-driven e fica QUIETA entre eventos (ninguém clicando → backlog parado).
  # Um tick periódico a cada 15 min varre o backlog e drena sozinho. Mantém TODOS os gatilhos de evento acima; no tick
  # por schedule não há github.event.pull_request — o job varre a lista de PRs, não uma PR específica, então roda igual.
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: fila-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fila:
    # filtros baratos: só acorda quando o evento pode mudar o estado da fila
    if: >-
      (github.event_name != 'pull_request_target' || (!github.event.pull_request.draft && github.event.pull_request.base.ref == 'main')) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, 'MERGE AUTORIZADO'))) &&
      (github.event_name != 'status' || (startsWith(github.event.context, 'Vercel') && github.event.state != 'pending'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # checkout da MAIN (código confiável). O código da PR só entra como objeto git para o patch-id — nunca é executado.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Token da fila
        env:
          FILA_MERGE_TOKEN: ${{ secrets.FILA_MERGE_TOKEN }}
        run: |
          [ -n "$FILA_MERGE_TOKEN" ] || { echo "::error::segredo FILA_MERGE_TOKEN ausente — sem ele o merge não dispara o deploy-migrations. Peça ao CEO."; exit 1; }
      - name: Processar a fila (uma PR por vez)
        env:
          GH_TOKEN: ${{ secrets.FILA_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Observabilidade (CEO 10/10): grava "por que cada PR está presa" em erp_esteira_pr_estado (produção, onde a aba
          # /dashboard/dev lê). Ausentes → flush_estado é no-op; a fila nunca quebra por causa disto.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: scripts/merge/fila-merge.sh
