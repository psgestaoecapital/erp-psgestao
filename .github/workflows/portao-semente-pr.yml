name: Portão de semente (PR)

# INFRA-TESTES slice 1 (erp_contexto_projeto f076af2d) — detecção PRECOCE, ADITIVA. Numa vaga limpa e DESCARTÁVEL
# (supabase start no próprio runner, 127.0.0.1 — nunca a produção nem as vagas de aceitação), monta o banco SÓ com as
# migrations do repo, carrega os catálogos globais (produção só leitura, via catalogos.sh), planta a semente, roda o
# fn_demo_reset e um smoke. PR que dessincroniza migration/semente falha AQUI, antes do merge, em vez de sangrar a main.
# Não usa fila de aceitação nem banco compartilhado. Só PR do próprio repositório (precisa de segredo de leitura).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/banco-testes/**'
      - '.github/workflows/portao-semente-pr.yml'
  workflow_dispatch:

concurrency:
  group: portao-semente-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portao:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BANCO_EFEMERO_LOCAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # supabase start aplica supabase/migrations do zero (schema + ledger batem por construção). Sem serviços inúteis.
      - name: Subir o banco efêmero (aplica TODAS as migrations do zero)
        run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,studio,mailpit,postgres-meta,supavisor
      - name: Garantir extensões (unaccent em public)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION IF NOT EXISTS unaccent WITH SCHEMA public;"
      - name: Catálogos globais (produção só leitura → banco efêmero)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SEED_INTERSECAO: '1'
        run: |
          set -euo pipefail
          pgdg=/usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          [ -x "$pgdg" ] || sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo "$pgdg" -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          export PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump PSQL=/usr/lib/postgresql/17/bin/psql
          pool=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects/horsymhsinqcimflrtjo/config/database/pooler)
          host=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // empty' <<< "$pool")
          user=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user // empty' <<< "$pool")
          [ -n "$host" ] && [ -n "$user" ] || { echo "::error::não achei o pooler da produção na API de gestão"; exit 1; }
          senha=$(jq -rn --arg s "$SUPABASE_DB_PASSWORD" '$s | @uri')
          PROD_DATABASE_URL="postgresql://$user:$senha@$host:5432/postgres"
          echo "::add-mask::$senha"; echo "::add-mask::$PROD_DATABASE_URL"
          PROD_DATABASE_URL="$PROD_DATABASE_URL" scripts/banco-testes/catalogos.sh
      - name: Smoke da semente (robô + semente.sql + fn_demo_reset + 1 asserção por vertical)
        run: |
          export PSQL=/usr/lib/postgresql/17/bin/psql
          scripts/banco-testes/smoke.sh
      - name: Parar o banco efêmero
        if: always()
        run: supabase stop --no-backup || true
