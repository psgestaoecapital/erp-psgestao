name: Registrar esteira (aba Codes)

# CEO 08/10 — alimenta "teste da main" e "fila de testes" da faixa da aba Codes (erp_dev_esteira_status).
# workflow_run roda o código da MAIN; checkout só de scripts/dev. Falha vira ::warning, nunca derruba nada.
on:
  workflow_run:
    workflows: ['Aceitação da main (banco de testes)', 'Aceitação (preview)']
    types: [requested, in_progress, completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: registrar-esteira
  cancel-in-progress: true

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grava o estado da esteira
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/dev/registrar-esteira.mjs
