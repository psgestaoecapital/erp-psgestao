name: Vigia de runs presos

# CEO 06/10 (regra e): os jobs de aceitação têm timeout de 40 min; este vigia cancela o run cujo job está EXECUTANDO
# há mais de 45 min (runner perdido, timeout que não pegou) — um run preso trava a fila única da demo (demo-e2e) para
# todo mundo. Job ESPERANDO a vez na fila (queued/waiting) não é preso e nunca é cancelado.
# Run cancelado não é vermelho: o @pos-migration cancelado é re-rodado pela fila de merge (regra a).
# Re-run automático (Eng. Chefe 07/10): a rede das sessões do Code troca o token pelo da integração e o POST /rerun dá 403,
# então quem re-roda é o próprio GitHub. Aceitação (PR e @pos-migration) CANCELADA na última 1 h, cujo SHA ainda é o head
# de uma PR aberta (ou a ponta da main), é re-rodada com FILA_MERGE_TOKEN — no máximo 2 re-runs por SHA (run_attempt <= 2).
# Run de SHA superado (cancelado pela triagem) não entra. Re-run manual: comentar /re-rodar na PR (comando-pr.yml).
# Custo zero: repositório público (minutos do Actions gratuitos), ~10 s por rodada.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LIMITE_MIN: '45'
      # aceitacao-main (CEO 11/10): build + suíte completa levam ~45-55 min; o teto de 45 a matava antes de fechar o verde.
      # Teto próprio de 70 min só para ela (job com timeout de 75); o zumbi de 90 min continua valendo para todos.
      LIMITE_MAIN_MIN: '70'
      # workflows de e2e da demo (os que entram na fila demo-e2e) e a montagem do banco de testes
      VIGIADOS: aceitacao-pr.yml aceitacao-pos-migration.yml aceitacao-main.yml jornadas-revenda.yml juiz-revenda.yml montar-banco-testes.yml
      # zumbi (Eng. Chefe 08/10): run de aceitação EM ANDAMENTO há mais de 90 min (idade do run, não do job) é cancelado
      LIMITE_RUN_MIN: '90'
      ACEITACOES: aceitacao-pr.yml aceitacao-pos-migration.yml aceitacao-main.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cancelar run com job executando há mais de 45 min
        run: |
          set -euo pipefail
          agora=$(date -u +%s); n=0
          for wf in $VIGIADOS; do
            for id in $(gh api "repos/$REPO/actions/workflows/$wf/runs?status=in_progress&per_page=50" --jq '.workflow_runs[].id'); do
              # o job mais antigo em execução (started_at de job queued/waiting não conta)
              ini=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
                --jq '[.jobs[] | select(.status == "in_progress") | .started_at] | min // empty')
              [ -n "$ini" ] || continue
              min=$(( (agora - $(date -u -d "$ini" +%s)) / 60 ))
              limite=$LIMITE_MIN; [ "$wf" = "aceitacao-main.yml" ] && limite=$LIMITE_MAIN_MIN
              [ "$min" -gt "$limite" ] || continue
              echo "::warning title=run preso cancelado::$wf run $id com job executando há $min min (> $limite)"
              echo "- $wf · run $id · $min min executando → cancelado" >> "$GITHUB_STEP_SUMMARY"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null \
                || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" > /dev/null || true
              n=$((n + 1))
            done
          done
          echo "runs presos cancelados: $n"

      # Zumbi 08/10: a Aceitação (preview) #1080 ficou "In progress" ~15 h segurando o grupo aceitacao-testes, e nenhum timeout
      # pegou. Teto pela IDADE do run (run_started_at), independente do estado dos jobs: > 90 min em andamento = cancela com aviso.
      - name: Cancelar aceitação em andamento há mais de 90 min (zumbi)
        run: |
          set -uo pipefail
          agora=$(date -u +%s); n=0
          for wf in $ACEITACOES; do
            gh api "repos/$REPO/actions/workflows/$wf/runs?status=in_progress&per_page=50" \
              --jq '.workflow_runs[] | "\(.id) \(.run_started_at) \(.head_sha)"' 2>/dev/null | while read -r id ini sha; do
              [ -n "$id" ] && [ -n "$ini" ] || continue
              min=$(( (agora - $(date -u -d "$ini" +%s)) / 60 ))
              [ "$min" -gt "$LIMITE_RUN_MIN" ] || continue
              echo "::warning title=aceitação zumbi cancelada::$wf run $id (head ${sha:0:7}) em andamento há $min min (> $LIMITE_RUN_MIN)"
              echo "- $wf · run $id · em andamento há $min min → cancelado (zumbi)" >> "$GITHUB_STEP_SUMMARY"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null \
                || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" > /dev/null || true
            done
          done

      # Esteira travada 08/10: 6+ runs da "Aceitação da main" de SHAs antigos esperavam horas na fila aceitacao-testes
      # e, ao chegar a vez, cada um só ia dizer "ponta já julgada". Run ESPERANDO (pending/queued) de SHA que não é mais a
      # ponta da main está superado: cancela (o da ponta atual fica). Run executando nunca é tocado aqui.
      - name: Cancelar aceitação da main superada (esperando a fila, SHA que não é a ponta)
        run: |
          set -uo pipefail
          main_sha=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || true)
          [ -n "$main_sha" ] || { echo "sem SHA da main, nada a fazer"; exit 0; }
          n=0
          for st in pending queued waiting; do
            for linha in $(gh api "repos/$REPO/actions/workflows/aceitacao-main.yml/runs?status=$st&per_page=50" \
              --jq ".workflow_runs[] | select(.head_sha != \"$main_sha\") | .id" 2>/dev/null); do
              echo "- aceitacao-main · run $linha · SHA superado, esperando a fila → cancelado" >> "$GITHUB_STEP_SUMMARY"
              gh api -X POST "repos/$REPO/actions/runs/$linha/cancel" > /dev/null || true
              n=$((n + 1))
            done
          done
          echo "aceitação da main superada cancelada: $n"

      # Esteira travada 08/10 (Eng. Chefe) + 2h na fila 10/10 (CEO): run de aceitação de PR que ocupa a vaga única à toa —
      # PR mergeada/fechada, ou SHA superado/órfão (não é head de PR aberta nem a ponta da main) — é cancelado. AGORA
      # inclui os runs status=in_progress presos na fila de concorrência (job sem step): era onde eles ficavam 2h até o
      # zumbi matar aos 90 min. A versão VIVA de PR aberta e o run da main nunca são tocados (scripts/merge/aceitacao-prune.sh).
      - name: Liberar vaga (cancela aceitação de PR morta / SHA superado — inclui presos na fila)
        run: scripts/merge/aceitacao-prune.sh || true

      # (13/10) Aceitação MORTA (sem PR aberta com este head e fora da ponta da main) que já está EXECUTANDO há mais de 20 min
      # não segura a vaga única até os 45/90: cancela. Run de versão viva nunca entra aqui (teto próprio de 45/90 continua).
      - name: Cancelar aceitação MORTA executando há mais de 20 min
        env:
          LIMITE_MORTA_MIN: '20'
        run: |
          set -uo pipefail
          agora=$(date -u +%s); n=0
          main_sha=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || true)
          gh api "repos/$REPO/actions/workflows/aceitacao-pr.yml/runs?status=in_progress&per_page=50" \
            --jq '.workflow_runs[] | "\(.id) \(.run_started_at) \(.head_sha)"' 2>/dev/null | while read -r id ini sha; do
            [ -n "$id" ] && [ -n "$ini" ] || continue
            min=$(( (agora - $(date -u -d "$ini" +%s)) / 60 ))
            [ "$min" -gt "$LIMITE_MORTA_MIN" ] || continue
            [ "$sha" = "$main_sha" ] && continue
            viva=$(gh api "repos/$REPO/commits/$sha/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$sha\")] | length" 2>/dev/null || echo 1)
            [ "${viva:-1}" -eq 0 ] || continue
            echo "::warning title=aceitação morta cancelada::run $id (head ${sha:0:7}) morta, executando há $min min (> $LIMITE_MORTA_MIN)"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null || true
          done

      - name: Re-rodar aceitação cancelada (máx. 2 vezes por SHA)
        env:
          # PAT da fila; sem ele cai no token do job (que pode dar 403 e o passo só avisa)
          GH_TOKEN: ${{ secrets.FILA_MERGE_TOKEN || github.token }}
        run: |
          set -uo pipefail
          desde=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          main_sha=$(gh api "repos/$REPO/commits/main" --jq .sha 2>/dev/null || true)
          n=0
          for wf in aceitacao-pr.yml aceitacao-pos-migration.yml; do
            gh api "repos/$REPO/actions/workflows/$wf/runs?status=cancelled&created=>=$desde&per_page=30" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha) \(.run_attempt)"' 2>/dev/null | while read -r id sha tent; do
              [ -n "$id" ] || continue
              if [ "$tent" -gt 2 ]; then echo "run $id: já re-rodado 2 vezes, não repete"; continue; fi
              # há outro run mais novo do mesmo SHA/workflow (já re-rodado ou novo)? então este não é o último
              ult=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || true)
              [ "$ult" = "$id" ] || { echo "run $id: SHA $sha tem run mais novo ($ult), ignorado"; continue; }
              # SHA ainda vale? head de PR aberta ou ponta da main
              vale=$(gh api "repos/$REPO/commits/$sha/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$sha\")] | length" 2>/dev/null || echo 0)
              if [ "$vale" -eq 0 ] && [ "$sha" != "$main_sha" ]; then echo "run $id: SHA superado, ignorado"; continue; fi
              if gh api -X POST "repos/$REPO/actions/runs/$id/rerun" > /dev/null 2>&1; then
                echo "- $wf · run $id · cancelado → re-rodado (tentativa $((tent + 1)))" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning title=re-run falhou::$wf run $id (FILA_MERGE_TOKEN ausente ou sem permissão Actions)"
              fi
            done
          done
